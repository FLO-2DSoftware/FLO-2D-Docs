name: Build and publish multiversion documentation

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout all branches
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "sphinx<7.3" \
            sphinx-multiversion==0.2.4 \
            sphinx-rtd-theme \
            sphinx-rtd-dark-mode==1.3.0 \
            sphinxcontrib-mermaid \
            sphinx_togglebutton \
            sphinx_design \
            ghp-import

      - name: Remove dark theme footer attribution
        run: |
          python - <<'PY'
          from pathlib import Path
          import sphinx_rtd_dark_mode
      
          js_file = (
              Path(sphinx_rtd_dark_mode.__file__).parent
              / "static/dark_mode_js/theme_switcher.js"
          )
      
          content = js_file.read_text(encoding="utf-8")
      
          start = content.index("  $('footer').html(")
          end = content.index("\n});", start)
      
          content = content[:start] + content[end:]
          js_file.write_text(content, encoding="utf-8")
      
          print("Removed dark theme footer attribution.")
          PY
      
      - name: Build multiversion docs
        run: |
          sphinx-multiversion source _site

      - name: List _site contents
        run: |
          ls -R _site

      - name: Add root index.html
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="Refresh" content="0; url=Build25/index.html" /></head><body><p>Redirecting to Build25...</p></body></html>' > _site/index.html

      - name: Add CNAME for custom domain
        run: |
          echo "documentation.flo-2d.com" > _site/CNAME

      - name: Deploy using ghp-import
        run: |
          ghp-import -n -p -f _site

